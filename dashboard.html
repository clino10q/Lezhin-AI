<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      display: flex;
      min-height: 100dvh;
      background: #0a0a0a;
      color: #f0f0f0;
      overflow: hidden;
    }
 
    /* SIDEBAR */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #111111;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease;
      z-index: 100;
      position: relative;
    }
 
    #sidebar.collapsed {
      width: 72px;
      min-width: 72px;
    }
 
    .sidebar-header {
      padding: 0 1rem 1rem;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
 
    .sidebar-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
 
    .sidebar-header h1 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ff2a2a;
      letter-spacing: 0.03em;
      transition: opacity 0.2s;
    }
 
    #sidebar.collapsed .sidebar-header h1 {
      opacity: 0;
      width: 0;
      overflow: hidden;
    }
 
    #sidebar.collapsed .new-chat-btn {
      padding: 10px;
      justify-content: center;
    }
 
    #sidebar.collapsed .new-chat-btn span {
      display: none;
    }
 
    /* Close button — only visible on mobile */
    #closeSidebar {
      display: none;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 20px;
      padding: 0;
      line-height: 1;
    }
 
    .new-chat-btn {
      margin-top: 10px;
      width: 100%;
      padding: 10px 12px;
      background: #ff2a2a;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
 
    .new-chat-btn:hover { background: #cc1f1f; }
 
    /* Sidebar nav items */
    .sidebar-nav {
      padding: 0.75rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
 
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
    }
 
    .nav-item:hover {
      background: #1e1e1e;
      color: #f0f0f0;
    }
 
    .nav-item.active {
      background: #1e1e1e;
      color: #ff2a2a;
      font-weight: 600;
    }
 
    .nav-item i {
      font-size: 18px;
      width: 20px;
      text-align: center;
    }
 
    #sidebar.collapsed .nav-item span {
      display: none;
    }
 
    .history-label {
      padding: 1rem 1rem 0.5rem;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      transition: opacity 0.2s;
    }
 
    #sidebar.collapsed .history-label {
      opacity: 0;
      height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
 
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem;
    }
 
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
 
    .history-item {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
 
    .history-item:hover { background: #1e1e1e; color: #f0f0f0; }
 
    .history-item.active {
      background: #1e1e1e;
      color: #ff2a2a;
      font-weight: 600;
    }
 
    .history-item .delete-btn {
      margin-left: auto;
      opacity: 0;
      font-size: 16px;
      color: #666;
    }
 
    .history-item:hover .delete-btn {
      opacity: 1;
    }
 
    /* OVERLAY */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }
 
    /* COLLAPSE TOGGLE */
    #toggleSidebar {
      position: absolute;
      right: -12px;
      top: 18px;
      width: 24px;
      height: 24px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      cursor: pointer;
      z-index: 110;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }
 
    #toggleSidebar:hover {
      background: #222;
      color: #ff2a2a;
    }
 
    /* MAIN */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
 
    #topbar {
      padding: 12px 1.5rem;
      border-bottom: 1px solid #2a2a2a;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
 
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
 
    #menuBtn {
      display: none;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 22px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }
 
    #chatTitle {
      font-size: 14px;
      font-weight: 600;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    .model-badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      background: #1e1e1e;
      color: #ff2a2a;
      border: 1px solid #ff2a2a44;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
 
    /* MESSAGES, INPUT, etc. — unchanged */
    #messages {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
 
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
 
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: #555;
      text-align: center;
      padding: 1rem;
    }
 
    #empty-state i { font-size: 48px; color: #ff2a2a44; }
    #empty-state p { font-size: 15px; color: #666; }
 
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 500px;
    }
 
    .suggestion-chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
      background: #111;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      transition: all 0.15s;
    }
 
    .suggestion-chip:hover {
      background: #1e1e1e;
      color: #ff2a2a;
      border-color: #ff2a2a44;
    }
 
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
 
    .msg-row.user { flex-direction: row-reverse; }
 
    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
 
    .avatar.ai { background: #ff2a2a; color: #fff; }
    .avatar.user { background: #222; color: #aaa; border: 1px solid #333; }
 
    .bubble {
      max-width: 70%;
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
    }
 
    .msg-row.ai .bubble {
      background: #161616;
      border: 1px solid #2a2a2a;
      color: #e8e8e8;
      border-top-left-radius: 4px;
    }
 
    .msg-row.user .bubble {
      background: #ff2a2a;
      color: #fff;
      border: none;
      border-top-right-radius: 4px;
    }
 
    .bubble pre {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 12px;
      margin: 8px 0;
    }
 
    .bubble code {
      background: #0d0d0d;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: #ff6b6b;
    }
 
    .typing-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff2a2a;
      animation: blink 1.2s infinite;
      margin: 0 2px;
    }
 
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
 
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
 
    #input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid #2a2a2a;
      background: #111111;
      position: sticky;
      bottom: 0;
      z-index: 20;
    }
 
    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 10px 14px;
      background: #1a1a1a;
      transition: border-color 0.15s;
    }
 
    #input-row:focus-within { border-color: #ff2a2a; }
 
    #userInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      color: #f0f0f0;
      outline: none;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      font-family: Arial, sans-serif;
    }
 
    #userInput::placeholder { color: #444; }
 
    #sendBtn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      border: none;
      background: #ff2a2a;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s;
    }
 
    #sendBtn:hover { background: #cc1f1f; }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }
    #sendBtn i { font-size: 16px; }
 
    #footer-note {
      margin-top: 8px;
      font-size: 11px;
      color: #444;
      text-align: center;
    }
 
    /* RESPONSIVE */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
        width: 260px !important;
      }
 
      #sidebar.open {
        transform: translateX(0);
      }
 
      #sidebar.collapsed { display: none; }
 
      #overlay.show { display: block; }
 
      #menuBtn { display: block; }
      #closeSidebar { display: block; }
 
      #toggleSidebar { display: none; }

      #input-area {
        padding-bottom: calc(1rem + env(safe-area-inset-bottom));
      }

      #messages {
        padding-bottom: 12px;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="toggleSidebar" onclick="toggleCollapse()">
      <i class="ti ti-chevron-left"></i>
    </div>

    <div class="sidebar-header">
      <div class="sidebar-top-row">
        <h1><i class="ti ti-sparkles"></i> <span>Lezhin</span></h1>
        <button id="closeSidebar" onclick="closeSidebar()" aria-label="Close sidebar">
          <i class="ti ti-x"></i>
        </button>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <i class="ti ti-plus"></i> <span>New chat</span>
      </button>
    </div>

    <!-- Navigation -->
    <div class="sidebar-nav">
      <div class="nav-item active" onclick="switchSection('chats')">
        <i class="ti ti-message"></i>
        <span>Chats</span>
      </div>
      <div class="nav-item" onclick="switchSection('tools')">
        <i class="ti ti-tools"></i>
        <span>Tools</span>
      </div>
      <div class="nav-item" onclick="switchSection('settings')">
        <i class="ti ti-settings"></i>
        <span>Settings</span>
      </div>
    </div>

    <p class="history-label">Recent Chats</p>
    <div class="history-list" id="historyList"></div>

    <!-- User profile -->
    <div id="userProfile" style="padding: 12px 1rem; border-top: 1px solid #2a2a2a; display: flex; align-items: center; gap: 10px; margin-top: auto;">
      <div style="width: 34px; height: 34px; min-width: 34px; border-radius: 50%; background: #ff2a2a; display: flex; align-items: center; justify-content: center;">
        <i class="ti ti-user" style="font-size: 17px; color: #fff;"></i>
      </div>
      <div style="overflow: hidden;">
        <p id="sidebarUsername" style="font-size: 13px; font-weight: 600; color: #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Guest</p>
        <p style="font-size: 11px; color: #555;">Logged in</p>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <button id="menuBtn" onclick="openSidebar()" aria-label="Open menu">
          <i class="ti ti-menu-2"></i>
        </button>
        <span id="chatTitle">New conversation</span>
      </div>
      <span class="model-badge">Lezhin Space 4.0</span>
    </div>

    <div id="messages">
      <!-- messages populated by JS -->
    </div>

    <div id="input-area">
      <div id="input-row">
        <textarea id="userInput" rows="1" placeholder="Ask anything..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="sendBtn" onclick="sendMessage()" aria-label="Send message">
          <i class="ti ti-arrow-up"></i>
        </button>
      </div>
      <p id="footer-note">Powered by Uniform — responses may not always be accurate.</p>
    </div>
  </div>

  <div id="overlay" onclick="closeSidebar()"></div>

  <script src="dashboard.js"></script>
  <script>
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('show');
    }
 
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    function toggleCollapse() {
      const sidebar = document.getElementById('sidebar');
      const icon = document.querySelector('#toggleSidebar i');
      
      sidebar.classList.toggle('collapsed');
      
      if (sidebar.classList.contains('collapsed')) {
        icon.classList.remove('ti-chevron-left');
        icon.classList.add('ti-chevron-right');
      } else {
        icon.classList.remove('ti-chevron-right');
        icon.classList.add('ti-chevron-left');
      }
      
      // Optional: save preference
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    function switchSection(section) {
      // Simple placeholder for future sections
      if (section === 'chats') {
        // already on chats
      } else if (section === 'tools') {
        alert("🛠️ Tools section coming soon (image gen, file upload, etc.)");
      } else if (section === 'settings') {
        alert("⚙️ Settings: Theme, API keys, Clear history, Export chats");
      }
    }

    // Load collapse preference
    window.addEventListener('load', () => {
      const collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
      if (collapsed) {
        document.getElementById('sidebar').classList.add('collapsed');
        const icon = document.querySelector('#toggleSidebar i');
        icon.classList.remove('ti-chevron-left');
        icon.classList.add('ti-chevron-right');
      }
    });
  </script>
</body>
</html>
