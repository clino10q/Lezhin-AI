<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('./images/insight2.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
}

.container {
    width: 100%;
    max-width: 400px;
    padding: 20px;
}

.card {
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
    color: #222;
}

p {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #DE1212;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #DE1212;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ffffff;
    border: 1px solid #DE1212;
    color: #DE1212;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #DE1212;
    text-decoration: none;
    font-size: 14px;
}

.back-link:hover {
    text-decoration: underline;
}

.success-message {
    display: none;
    margin-top: 15px;
    color: #DE1212;
    text-align: center;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <button type="submit">
                Send Reset Link
            </button>

            <div class="success-message" id="successMessage">
                Password reset link sent successfully.
            </div>
        </form>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>
    </div>
</div>

<script>
document
    .getElementById("forgotPasswordForm")
    .addEventListener("submit", function(e) {
        e.preventDefault();

        document.getElementById("successMessage").style.display = "block";

        // Example:
        // Send email to backend API here
    });
</script>

</body>
</html>
